site:
  base_url: https://www.a42r.com
  name: a42r
  tagline: Things I build, use, and give away.
  summary: >-
    a42r is a small collection of apps, extensions and tools for riders,
    developers and anyone who likes tidy software. Some are live, some are on
    the way.
  home_title: a42r Projects - Apps, Extensions and Tools
  home_description: >-
    Browse a42r projects: Android apps, browser extensions, web apps and
    self-hosted tools for riders, developers and everyone else.
  privacy_title: Privacy at a42r - No Tracking, No Cookies
  privacy_description: >-
    How the a42r site handles your data: no cookies, no analytics and no
    third-party requests, just short-lived server and Cloudflare access logs.

platforms:
  - slug: android
    name: Android
    title: Android Apps by a42r - Riding, Travel and Utilities
    description: >-
      Android apps from a42r, covering charging maps, live ETA sharing, riding
      data and document viewing. Browse what is live and what is coming soon.
    intro: >-
      These projects run on an Android phone. Most are sideloaded or installed
      from a project site, and none of them need an account to get started.
      Live apps come first, followed by the ones still being finished.
  - slug: browser-extensions
    name: Browser extensions
    title: Browser Extensions by a42r - Capture and Form Filling
    description: >-
      Browser extensions from a42r for screenshot capture and test data entry.
      See which ones are live and which are still being prepared for release.
    intro: >-
      Extensions that live in your browser toolbar and do one job each. They
      work on the page you already have open, so there is nothing new to learn.
      More extensions are planned.
  - slug: web-apps
    name: Web apps
    title: Web Apps by a42r - Image Tools, Routes and Reporting
    description: >-
      Web apps from a42r that run in a browser tab, from image compression to
      route analysis and parking reports. Nothing to install to try them.
    intro: >-
      Open a tab and get to work. These apps run in the browser, either hosted
      by us or on a server you control. Some also come as Android apps or
      browser extensions.
  - slug: desktop-self-hosted
    name: Desktop and self-hosted
    title: Desktop and Self-Hosted Tools by a42r
    description: >-
      Desktop and self-hosted tools from a42r: push servers, Home Assistant
      integrations, video overlays and download automation you run yourself.
    intro: >-
      Software you run on your own machine or server, so the data stays with
      you. Expect command-line tools, Docker containers and Home Assistant
      add-ons. Setup takes a little more effort, and the payoff is control.

purposes:
  - slug: development-tools
    name: Development tools
    title: Development Tools by a42r - Image, Docs and Test Data
    description: >-
      Development tools from a42r: image compression, encrypted Markdown
      viewing and test data filling for web developers and testers.
    intro: >-
      Tools that make building and testing software a little less tedious. They
      cover preparing images, reading documentation on the go and filling in
      forms with believable data.
  - slug: euc-riding-tools
    name: EUC riding tools
    title: EUC Riding Tools by a42r - Maps, ETA and Telemetry
    description: >-
      Tools for electric unicycle riders from a42r: charging spot maps, ETA
      sharing, OsmAnd widgets, charge monitoring and ride video overlays.
    intro: >-
      Built by and for people who ride electric unicycles and other personal
      electric vehicles. They help you find a socket, tell people when you will
      arrive, watch your wheel charge and make sense of ride data.
  - slug: other-tools
    name: Other tools
    title: Other Tools by a42r - Reports, Puzzles and Downloads
    description: >-
      Everything else from a42r: parking reports, document transfer, Sudoku
      practice and Linux ISO downloads that keep themselves up to date.
    intro: >-
      Projects that do not fit a neat label but earn their place anyway. Some
      solve a civic annoyance, some tidy up a chore, and one is just for
      practising puzzles.


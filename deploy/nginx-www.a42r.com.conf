# Static vhost for https://www.a42r.com/ (install to /etc/nginx/conf.d or sites-enabled).
# Deliberately www only: the apex a42r.com is not served or redirected here.

server {
    listen 80;
    listen [::]:80;
    server_name www.a42r.com;
    return 301 https://www.a42r.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.a42r.com;

    root /opt/apps/a42r/website;
    index index.html;

    ssl_certificate /etc/letsencrypt/live/www.a42r.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.a42r.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/xml application/manifest+json;

    error_page 404 /404.html;

    location / {
        try_files $uri $uri/ =404;
    }

    location = /site.webmanifest {
        types { }
        default_type application/manifest+json;
    }

    # The stylesheet URL carries ?v=<content hash>, so assets can be cached.
    # HTML keeps the default (revalidated) caching.
    location ~* \.(webp|jpg|png|svg|css)$ {
        expires 30d;
    }
}
